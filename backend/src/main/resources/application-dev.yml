spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/taskflow
  data:
    redis:
      host: localhost
      port: 6379

app:
  security:
    issuer: http://localhost:8081/realms/taskflow
    jwk-set-uri: http://localhost:8081/realms/taskflow/protocol/openid-connect/certs
    audience: taskflow-api
  cors:
    allowed-origins: http://localhost:4200

spring:
  application:
    name: taskflow
  profiles:
    default: api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/taskflow}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:taskflow_app}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: 2s
      repositories:
        enabled: false
  task:
    scheduling:
      pool:
        size: 3

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.example.backend: INFO

app:
  security:
    issuer: ${APP_SECURITY_ISSUER:http://localhost:8081/realms/taskflow}
    jwk-set-uri: ${APP_SECURITY_JWK_SET_URI:http://localhost:8081/realms/taskflow/protocol/openid-connect/certs}
    audience: ${APP_SECURITY_AUDIENCE:taskflow-api}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  rate-limit:
    limit: ${APP_RATE_LIMIT_LIMIT:60}
    window-seconds: ${APP_RATE_LIMIT_WINDOW_SECONDS:60}
    key-prefix: ${APP_RATE_LIMIT_PREFIX:rl}
  cache:
    dashboard-ttl-seconds: 60
  idempotency:
    retention-hours: 24
  worker:
    poll-delay-ms: 5000
    max-attempts: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Render Blueprint. Local Compose is unchanged and still uses localhost.
# Apply this from the Render dashboard after the GitHub repo is on main.
# Hostnames below are the public addresses. Private traffic uses the service name and port 10000.

services:
  - type: web
    name: adfinance-rwanda-cates-web
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: API_UPSTREAM
        value: http://adfinance-rwanda-cates-api:10000
      - key: KEYCLOAK_ISSUER
        value: https://adfinance-rwanda-cates-auth.onrender.com/realms/taskflow
      - key: KEYCLOAK_CLIENT_ID
        value: taskflow-spa

  - type: web
    name: adfinance-rwanda-cates-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: JAVA_OPTS
        value: "-Xmx256m"
      - key: SPRING_PROFILES_ACTIVE
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: adfinance-rwanda-cates-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: adfinance-rwanda-cates-redis
          type: keyvalue
          property: connectionString
      - key: APP_SECURITY_ISSUER
        value: https://adfinance-rwanda-cates-auth.onrender.com/realms/taskflow
      - key: APP_SECURITY_JWK_SET_URI
        value: https://adfinance-rwanda-cates-auth.onrender.com/realms/taskflow/protocol/openid-connect/certs
      - key: APP_SECURITY_AUDIENCE
        value: taskflow-api
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://adfinance-rwanda-cates-web.onrender.com,http://localhost:4200

  - type: worker
    name: adfinance-rwanda-cates-worker
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: JAVA_OPTS
        value: "-Xmx256m"
      - key: SPRING_PROFILES_ACTIVE
        value: worker
      - key: SERVER_PORT
        value: "8083"
      - key: DATABASE_URL
        fromDatabase:
          name: adfinance-rwanda-cates-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: adfinance-rwanda-cates-redis
          type: keyvalue
          property: connectionString
      - key: APP_SECURITY_ISSUER
        value: https://adfinance-rwanda-cates-auth.onrender.com/realms/taskflow
      - key: APP_SECURITY_JWK_SET_URI
        value: https://adfinance-rwanda-cates-auth.onrender.com/realms/taskflow/protocol/openid-connect/certs
      - key: APP_SECURITY_AUDIENCE
        value: taskflow-api

  - type: web
    name: adfinance-rwanda-cates-auth
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./keycloak/Dockerfile
    dockerContext: ./keycloak
    healthCheckPath: /realms/taskflow
    envVars:
      - key: PORT
        value: "10000"
      - key: JAVA_OPTS_APPEND
        value: "-Xmx768m"
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_HEALTH_ENABLED
        value: "true"
      - key: KC_HOSTNAME
        value: https://adfinance-rwanda-cates-auth.onrender.com
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_PROXY_HEADERS
        value: xforwarded

  - type: keyvalue
    name: adfinance-rwanda-cates-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: adfinance-rwanda-cates-db
    plan: free
    region: frankfurt
    databaseName: taskflow
    user: taskflow_app
    postgresMajorVersion: "16"
    ipAllowList: []
